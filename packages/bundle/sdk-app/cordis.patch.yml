# The SDK application over dsh-base. Stdout belongs exclusively to JSON-RPC.

- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: session-title-llm
  disabled: true

- insert:
    - id: sdk-app-startup
      name: '@deepseek-ai/dsh-sdk-app'
      config:
        profile: sdk

    - id: sdk-jsonrpc-server
      name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      config:
        maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"

    # Desktop / SDK clients: bridge Host approval/request → approval.require / approval/respond
    # on the shared JSON-RPC channel (not baked into the server core).
    # Do NOT mount agent-presets here: standard preset needs Host-only scopes and breaks session/prompt.
    - id: sdk-approval-bridge
      name: '@deepseek-ai/dsh-sdk-approval-bridge'
      inject: [sdkJsonRpc]
